<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}Austin Stanbury</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=8">
</head>
<body>
    <div class="container">
        {% include nav.html %}

        <main class="content">
            {{ content }}
        </main>
    </div>

    <script>
        document.querySelectorAll('.dropdown-toggle').forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                const parent = button.parentElement;
                parent.classList.toggle('dropdown-open');
                button.textContent = parent.classList.contains('dropdown-open') ? '−' : '+';
            });
        });

        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('.nav');
        if (hamburger) {
            hamburger.addEventListener('click', () => {
                nav.classList.toggle('nav-open');
            });
            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    nav.classList.remove('nav-open');
                });
            });
        }

        document.querySelectorAll('.video-carousel').forEach(carousel => {
            const slides = carousel.querySelectorAll('.carousel-slide');
            const counter = carousel.querySelector('.carousel-counter');
            let current = 0;

            function showSlide(i) {
                slides[current].classList.remove('active');
                current = (i + slides.length) % slides.length;
                slides[current].classList.add('active');
                counter.textContent = (current + 1) + ' / ' + slides.length;
            }

            carousel.querySelector('.carousel-prev').addEventListener('click', () => showSlide(current - 1));
            carousel.querySelector('.carousel-next').addEventListener('click', () => showSlide(current + 1));
        });
    </script>
</body>
</html>
